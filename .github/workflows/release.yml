name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Release Package
        run: |
          mkdir -p release-pkg
          cp target/release/simple_menu_manager release-pkg/
          cp dev.simplemenu.DesktopManager.desktop release-pkg/
          cp README.md release-pkg/
          cp Makefile release-pkg/
          tar -czvf simple_menu_manager-linux-x86_64.tar.gz -C release-pkg .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: simple_menu_manager-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
