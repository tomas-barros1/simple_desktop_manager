name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (GTK4 & LibAdwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            pkg-config \
            build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --verbose

      - name: Package Assets & Calculate SHA256
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="simple-menu-manager-v${VERSION}-x86_64-linux"
          BUNDLE_DIR="dist/${ARCHIVE_NAME}"
          
          mkdir -p "${BUNDLE_DIR}"
          cp target/release/simple_menu_manager "${BUNDLE_DIR}/"
          cp dev.simplemenu.DesktopManager.desktop "${BUNDLE_DIR}/"
          cp README.md "${BUNDLE_DIR}/"
          
          mkdir -p dist/archives
          tar -czvf "dist/archives/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"
          
          cd dist/archives
          sha256sum "${ARCHIVE_NAME}.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/archives/*.tar.gz
            dist/archives/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
